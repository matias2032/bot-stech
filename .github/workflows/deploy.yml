name: Coolify Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Exibir Mensagem do Commit
        run: |
          echo "Disparando deploy do commit: ${{ github.event.head_commit.message }}"

      - name: Trigger Deploy no Coolify
        run: |
          curl -X GET "${{ secrets.COOLIFY_DEPLOY_URL }}" \
               -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}